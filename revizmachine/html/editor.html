<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReVizmAsm Editor</title>
    <script src="../monaco/min/vs/loader.js"></script>
    <style>
        * {
            color-scheme: dark;
        }

        html {
            background-color: #0F0F10;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #181818;
        }

        #toolbar {
            background: #181818;
            padding: 10px;
            border-bottom: 1px solid #2B2B2B;
        }

        #editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 70%;
        }

        #editor {
            flex: 1;
            width: 100%;
            height: fit-content;
        }

        #resizer {
            height: 6px;
            background: #0f0f0f;
            cursor: row-resize;
            user-select: none;
            touch-action: none;
        }

        #output {
            height: 200px;
            border-top: 1px solid #2B2B2B;
            padding: 10px;
            background: #0f0f0f;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }

        button {
            margin-right: 10px;
            padding: 5px 10px;
        }
    </style>

</head>

<body>
    <div id="toolbar">
        <button id="assembleBtn">Assemble</button>
        <button id="downloadBtn">Download .vzm</button>
        <button id="loadToMemoryBtn">Load to VizMachine Memory</button>
        <button id="autoCompileToggle">Auto-compile: OFF</button>
    </div>

    <div id="editor-container">
        <div id="editor"></div>
        <div id="resizer"></div>
        <div id="output"></div>
    </div>

    <script>
        // Load Monaco via jsDelivr to avoid MIME-type blocks seen with unpkg (nosniff response).
        require.config({ paths: { 'vs': '../monaco/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            // Define the custom language
            monaco.languages.register({ id: 'revizmasm' });

            // Define custom theme
            monaco.editor.defineTheme('revizmasmTheme', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: 'comment', foreground: 'CC9977', fontStyle: 'italic' },
                    { token: 'label', foreground: '#DCDCAA', fontStyle: 'bold' }, // Labels
                    { token: 'cell', foreground: '#8DC5E3' }, // Memory cells
                    { token: 'keyword', foreground: '#569CD6', fontStyle: 'bold' }, // Registers and opcodes
                    { token: 'keyword.control', foreground: '4DC9B0', fontStyle: 'bold' }, // CONST
                    { token: 'number', foreground: '#B5CE9D' },
                    { token: 'constant', foreground: '8DC5E3' },
                    { token: 'delimiter', foreground: 'DDDDDD' },
                    { token: 'identifier', foreground: '#9CDCFE' },
                    { token: 'poi', foreground: 'D7BA7D' }, // Aliases
                    { token: 'register', foreground: 'C586C0', fontStyle: 'bold' }, // Registers
                    { token: 'registerAlias', foreground: 'C586C0' }, // Memory cells
                    { token: 'invalid', foreground: 'FF0000', fontStyle: 'italic' }
                    //{ token: 'label', foreground: '800080', fontStyle: 'bold' } // Labels with or without @
                ],
                colors: {
                    'editor.background': '#1F1F1F'
                }
            });

            // Define syntax highlighting
            monaco.languages.setMonarchTokensProvider('revizmasm', {
                tokenizer: {
                    root: [
                        // Comments
                        [/;.*/, 'comment'],
                        // Labels (support dots in label references)
                        [/@[\w.]+/, 'label'],
                        [/\b[\w][.\w]*:/, 'label'],
                        // Memory cells
                        [/\[\w+\]/, 'cell'],
                        // Registers
                        [/[Rr][0-9A-Fa-f]/, 'register'],
                        // Aliases
                        [/#\w+/, 'registerAlias'],
                        // CONST
                        [/\bCONST\b/, 'keyword.control'],
                        // Opcodes
                        [/\b(LOAD|STORE|MOVE|ADD|ADDI|ADDF|OR|AND|XOR|RSHIFT|JUMP|HALT|WAIT|WRITE)\b/, 'keyword'],
                        // Numbers
                        [/\b(0x[0-9A-Fa-f]+|0b[01]+|0d[0-9]+|[0-9A-Fa-f]{1,2})\b/, 'number'],
                        // Identifiers
                        [/[A-Za-z]\w*/, 'identifier'],
                        // Operators
                        [/:|=/, 'delimiter'],
                        // Punctuation
                        [/,/, 'delimiter']
                    ]
                }
            });

            // Configure indentation rules
            monaco.languages.setLanguageConfiguration('revizmasm', {
                comments: {
                    lineComment: ';'
                },
                brackets: [
                    ['[', ']']
                ],
                autoClosingPairs: [
                    { open: '[', close: ']' },
                    { open: '"', close: '"' }
                ],
                surroundingPairs: [
                    { open: '[', close: ']' },
                    { open: '"', close: '"' }
                ],
                indentationRules: {
                    // Increase indent after a label definition (ends with :)
                    increaseIndentPattern: /^\s*[\w.]+:\s*$/,
                    // Decrease indent after terminal instructions (HALT or unconditional JUMP)
                    decreaseIndentPattern: /^\s*(HALT|JUMP\s+@[\w.]+)\s*(;.*)?$/
                },
                onEnterRules: [
                    {
                        // After a label definition, increase indent
                        beforeText: /^\s*[\w.]+:\s*$/,
                        action: { indentAction: monaco.languages.IndentAction.Indent }
                    },
                    {
                        // After HALT, decrease indent on next line
                        beforeText: /^\s*HALT\s*(;.*)?$/,
                        action: { indentAction: monaco.languages.IndentAction.Outdent }
                    },
                    {
                        // After unconditional JUMP (JUMP @label only), decrease indent on next line
                        beforeText: /^\s*JUMP\s+@[\w.]+\s*(;.*)?$/,
                        action: { indentAction: monaco.languages.IndentAction.Outdent }
                    }
                ]
            });

            // Opcode documentation with parameter types
            const opcodesDocs = {
                'LOAD': {
                    signature: 'LOAD Rd, [XY] | LOAD Rd, XY',
                    doc: 'Load data from memory [XY] into register Rd, or load immediate value XY into register Rd.',
                    params: [
                        { type: ['register', 'registerAlias'], desc: 'Destination register' },
                        { type: ['memory', 'immediate', 'constant'], desc: 'Source: memory address or immediate value' }
                    ]
                },
                'STORE': {
                    signature: 'STORE Rs, [XY]',
                    doc: 'Store data from register Rs into memory cell at address XY.',
                    params: [
                        { type: ['register', 'registerAlias'], desc: 'Source register' },
                        { type: ['memory', 'immediate', 'constant'], desc: 'Destination memory address' }
                    ]
                },
                'MOVE': {
                    signature: 'MOVE Rd, Rs',
                    doc: 'Move data from register Rs to register Rd.',
                    params: [
                        { type: ['register', 'registerAlias'], desc: 'Destination register' },
                        { type: ['register', 'registerAlias'], desc: 'Source register' }
                    ]
                },
                'ADD': {
                    signature: 'ADD Rd, Rs, Rt',
                    doc: 'Add integers from registers Rs and Rt (Two\'s complement), store result in Rd.',
                    params: [
                        { type: ['register', 'registerAlias'], desc: 'Destination register' },
                        { type: ['register', 'registerAlias'], desc: 'Source register 1' },
                        { type: ['register', 'registerAlias'], desc: 'Source register 2' }
                    ]
                },
                'ADDI': {
                    signature: 'ADDI Rd, Rs, Rt',
                    doc: 'Add integers from registers Rs and Rt (Two\'s complement), store result in Rd.',
                    params: [
                        { type: ['register', 'registerAlias'], desc: 'Destination register' },
                        { type: ['register', 'registerAlias'], desc: 'Source register 1' },
                        { type: ['register', 'registerAlias'], desc: 'Source register 2' }
                    ]
                },
                'ADDF': {
                    signature: 'ADDF Rd, Rs, Rt',
                    doc: 'Add floating-point values from registers Rs and Rt, store result in Rd.',
                    params: [
                        { type: ['register', 'registerAlias'], desc: 'Destination register' },
                        { type: ['register', 'registerAlias'], desc: 'Source register 1' },
                        { type: ['register', 'registerAlias'], desc: 'Source register 2' }
                    ]
                },
                'OR': {
                    signature: 'OR Rd, Rs, Rt',
                    doc: 'Bitwise OR of registers Rs and Rt, store result in Rd.',
                    params: [
                        { type: ['register', 'registerAlias'], desc: 'Destination register' },
                        { type: ['register', 'registerAlias'], desc: 'Source register 1' },
                        { type: ['register', 'registerAlias'], desc: 'Source register 2' }
                    ]
                },
                'AND': {
                    signature: 'AND Rd, Rs, Rt',
                    doc: 'Bitwise AND of registers Rs and Rt, store result in Rd.',
                    params: [
                        { type: ['register', 'registerAlias'], desc: 'Destination register' },
                        { type: ['register', 'registerAlias'], desc: 'Source register 1' },
                        { type: ['register', 'registerAlias'], desc: 'Source register 2' }
                    ]
                },
                'XOR': {
                    signature: 'XOR Rd, Rs, Rt',
                    doc: 'Bitwise XOR of registers Rs and Rt, store result in Rd.',
                    params: [
                        { type: ['register', 'registerAlias'], desc: 'Destination register' },
                        { type: ['register', 'registerAlias'], desc: 'Source register 1' },
                        { type: ['register', 'registerAlias'], desc: 'Source register 2' }
                    ]
                },
                'RSHIFT': {
                    signature: 'RSHIFT Rd, X',
                    doc: 'Right-shift the bit pattern in register Rd by X bits.',
                    params: [
                        { type: ['register', 'registerAlias'], desc: 'Register to shift' },
                        { type: ['immediate', 'constant'], desc: 'Number of bits to shift' }
                    ]
                },
                'JUMP': {
                    signature: 'JUMP Rd, @label | JUMP @label',
                    doc: 'Jump to address if Rd equals R0 (default R0 if one operand).',
                    params: [
                        { type: ['register', 'registerAlias', 'label'], desc: 'Condition register or label' },
                        { type: ['label'], desc: 'Target label (optional)' }
                    ]
                },
                'HALT': {
                    signature: 'HALT',
                    doc: 'Stop execution.',
                    params: []
                },
                'WAIT': {
                    signature: 'WAIT XYZ',
                    doc: 'Wait for XYZ milliseconds (hex value).',
                    params: [
                        { type: ['immediate', 'constant'], desc: 'Wait time in milliseconds' }
                    ]
                },
                'WRITE': {
                    signature: 'WRITE Rs, Rt',
                    doc: 'Write data from register Rs to memory address in register Rt.',
                    params: [
                        { type: ['register', 'registerAlias'], desc: 'Source register' },
                        { type: ['register', 'registerAlias'], desc: 'Address register' }
                    ]
                }
            };

            // Parse code to extract symbols and their documentation
            function parseSymbols(code) {
                const lines = code.split('\n');
                const symbols = {
                    constants: {},
                    labels: {},
                    aliases: {},
                    memoryAliases: {}
                };
                let lineNum = 0;
                for (let line of lines) {
                    lineNum++;
                    const commentMatch = line.match(/;(.*)$/);
                    const comment = commentMatch ? commentMatch[1].trim() : '';
                    const codePart = line.split(';')[0].trim();

                    if (!codePart) continue;

                    // CONST declarations
                    if (codePart.startsWith('CONST ')) {
                        const match = codePart.match(/CONST\s+(\w+)\s*=\s*(.+)/);
                        if (match) {
                            symbols.constants[match[1]] = {
                                value: match[2].trim(),
                                doc: comment,
                                line: lineNum
                            };
                        }
                    }
                    // Memory aliases [name]: value
                    else if (codePart.match(/^\[(\w+)\]:\s*(.+)/)) {
                        const match = codePart.match(/^\[(\w+)\]:\s*(.+)/);
                        if (match) {
                            symbols.memoryAliases[match[1]] = {
                                value: match[2].trim(),
                                doc: comment,
                                line: lineNum
                            };
                        }
                    }
                    // Register aliases #name: Rx
                    else if (codePart.match(/^#(\w+):\s*(R[0-9A-F])/i)) {
                        const match = codePart.match(/^#(\w+):\s*(R[0-9A-F])/i);
                        if (match) {
                            symbols.aliases[match[1]] = {
                                register: match[2].toUpperCase(),
                                doc: comment,
                                line: lineNum
                            };
                        }
                    }
                    // Labels (can contain dots like start.loop)
                    else if (codePart.match(/^([\w.]+):/)) {
                        const match = codePart.match(/^([\w.]+):/);
                        if (match && !codePart.startsWith('CONST')) {
                            symbols.labels[match[1]] = {
                                doc: comment,
                                line: lineNum
                            };
                        }
                    }
                }
                return symbols;
            }

            // Analyze context to determine what suggestions are appropriate
            function analyzeContext(textUntilPosition) {
                // For most checks, use trimmed version
                const trimmed = textUntilPosition.trim();

                // Empty line or start - show opcodes, CONST, label definitions, aliases
                if (!trimmed || trimmed.match(/^\s*$/)) {
                    return {
                        context: 'lineStart',
                        allowedTypes: ['opcode', 'const', 'label', 'alias', 'memoryAlias']
                    };
                }

                // After label definition (label:)
                if (trimmed.endsWith(':')) {
                    return {
                        context: 'afterLabel',
                        allowedTypes: ['opcode']
                    };
                }

                // CONST declaration
                if (trimmed.startsWith('CONST ')) {
                    if (!trimmed.includes('=')) {
                        return { context: 'constName', allowedTypes: [] };
                    }
                    return { context: 'constValue', allowedTypes: ['immediate', 'constant'] };
                }

                // Memory alias definition [name]:
                if (trimmed.match(/^\[(\w+)\]:/)) {
                    return { context: 'memoryValue', allowedTypes: ['immediate', 'constant'] };
                }

                // Register alias definition #name:
                if (trimmed.match(/^#(\w+):/)) {
                    return { context: 'registerAlias', allowedTypes: ['register'] };
                }

                // After an opcode - parse parameters (DON'T trim here to preserve trailing space!)
                const opcodeMatch = textUntilPosition.match(/^\s*(\w+)\s+(.*)$/);
                console.log('[analyzeContext] opcodeMatch:', opcodeMatch);
                if (opcodeMatch) {
                    const opcode = opcodeMatch[1].toUpperCase();
                    const params = opcodeMatch[2];
                    console.log('[analyzeContext] opcode:', opcode, 'params:', JSON.stringify(params));

                    if (opcodesDocs[opcode]) {
                        const expectedParams = opcodesDocs[opcode].params;

                        // Only provide suggestions if:
                        // 1. Right after opcode with space (params is empty or whitespace only)
                        // 2. Right after a comma (ends with comma and optional whitespace)
                        const isValidCompletionPosition =
                            params.trim() === '' ||  // "JUMP "
                            params.match(/,\s*$/);    // "JUMP a, " or "JUMP a,"

                        console.log('[analyzeContext] isValidCompletionPosition:', isValidCompletionPosition);

                        if (!isValidCompletionPosition) {
                            // Invalid position like "JUMP a " (space after param but no comma)
                            console.log('[analyzeContext] Invalid position, returning unknown');
                            return { context: 'unknown', allowedTypes: [] };
                        }

                        // Count actual parameters (split by comma, but handle empty strings)
                        let currentParam = 0;
                        if (params.trim() === '') {
                            // Just after opcode with space, no params yet
                            currentParam = 0;
                        } else {
                            // Count commas to determine which parameter we're on
                            const commaCount = (params.match(/,/g) || []).length;
                            currentParam = commaCount;
                        }

                        if (currentParam < expectedParams.length) {
                            const paramInfo = expectedParams[currentParam];
                            const result = {
                                context: 'parameter',
                                opcode: opcode,
                                paramIndex: currentParam,
                                allowedTypes: paramInfo ? paramInfo.type : [],
                                paramDesc: paramInfo ? paramInfo.desc : ''
                            };
                            console.log('[analyzeContext] Returning:', result);
                            return result;
                        }
                    }
                }

                return { context: 'unknown', allowedTypes: [] };
            }

            // Register completion provider
            monaco.languages.registerCompletionItemProvider('revizmasm', {
                triggerCharacters: ['R', 'r', '#', '@', '[', ' ', ','],
                provideCompletionItems: (model, position) => {
                    console.log('[Completion] Provider invoked at position:', position.lineNumber, position.column);
                    const code = model.getValue();
                    const symbols = parseSymbols(code);
                    const textUntilPosition = model.getValueInRange({
                        startLineNumber: position.lineNumber,
                        startColumn: 1,
                        endLineNumber: position.lineNumber,
                        endColumn: position.column
                    });

                    // Get the full text including any prefix characters
                    const lineText = model.getLineContent(position.lineNumber);
                    const textBefore = lineText.substring(0, position.column - 1);

                    // Match the current token including prefix characters (@label, #alias, [mem], Rx, or plain word)
                    // Note: labels can contain dots, so use [\w.]* for @ prefix
                    const tokenMatch = textBefore.match(/([@])([\w.]*)$|(#)(\w*)$|(\[)(\w*)$|(\bR)(\w*)$|(\w+)$/);
                    let currentToken = '';
                    let prefixChar = '';
                    let searchTerm = '';
                    let tokenStartCol = position.column;

                    if (tokenMatch) {
                        if (tokenMatch[1]) {
                            // Has @ prefix (labels can contain dots)
                            prefixChar = tokenMatch[1];
                            searchTerm = tokenMatch[2] || '';
                            currentToken = prefixChar + searchTerm;
                            tokenStartCol = position.column - currentToken.length;
                        } else if (tokenMatch[3]) {
                            // Has # prefix (aliases)
                            prefixChar = tokenMatch[3];
                            searchTerm = tokenMatch[4] || '';
                            currentToken = prefixChar + searchTerm;
                            tokenStartCol = position.column - currentToken.length;
                        } else if (tokenMatch[5]) {
                            // Has [ prefix (memory)
                            prefixChar = tokenMatch[5];
                            searchTerm = tokenMatch[6] || '';
                            currentToken = prefixChar + searchTerm;
                            tokenStartCol = position.column - currentToken.length;
                        } else if (tokenMatch[7]) {
                            // Has R prefix (registers)
                            prefixChar = 'R';
                            searchTerm = tokenMatch[8] || '';
                            currentToken = prefixChar + searchTerm;
                            tokenStartCol = position.column - currentToken.length;
                        } else if (tokenMatch[9]) {
                            // Plain word
                            searchTerm = tokenMatch[9];
                            currentToken = searchTerm;
                            tokenStartCol = position.column - currentToken.length;
                        }
                    }

                    // For context analysis, use the text up to (but not including) the current token
                    // If no token was found (e.g., cursor is after space), use all text
                    const textForContext = currentToken ? textUntilPosition.substring(0, tokenStartCol - 1) : textUntilPosition;
                    const context = analyzeContext(textForContext);

                    console.log('[Completion] textForContext:', JSON.stringify(textForContext));
                    console.log('[Completion] context:', context);
                    console.log('[Completion] currentToken:', JSON.stringify(currentToken), 'prefixChar:', JSON.stringify(prefixChar));
                    console.log('[Completion] searchTerm:', JSON.stringify(searchTerm));

                    // Determine what prefix filter to apply
                    const prefixFilter = {
                        onlyLabels: prefixChar === '@',
                        onlyAliases: prefixChar === '#',
                        onlyMemory: prefixChar === '[',
                        onlyRegisters: prefixChar === 'R'
                    };

                    const suggestions = [];

                    // Calculate the replacement range
                    let replaceStartCol = tokenStartCol;
                    if (prefixChar) {
                        replaceStartCol = tokenStartCol + 1; // Skip the prefix character
                    }

                    const range = {
                        startLineNumber: position.lineNumber,
                        endLineNumber: position.lineNumber,
                        startColumn: replaceStartCol,
                        endColumn: position.column
                    };

                    // Helper to check if a type is allowed
                    const isTypeAllowed = (type) => {
                        if (!context.allowedTypes || !Array.isArray(context.allowedTypes)) {
                            return false;
                        }
                        return context.allowedTypes.includes(type);
                    };

                    // Filter function - case insensitive search
                    const matchesSearch = (name) => {
                        if (!searchTerm) return true;
                        return name.toLowerCase().startsWith(searchTerm.toLowerCase());
                    };

                    // If a specific prefix is typed, only show that type IF it's allowed in this context
                    if (prefixFilter.onlyLabels) {
                        console.log('[Completion] onlyLabels filter, searchTerm:', JSON.stringify(searchTerm));
                        // Only show labels if label type is allowed
                        if (isTypeAllowed('label')) {
                            console.log('[Completion] Label type is allowed, checking labels:', Object.keys(symbols.labels));
                            for (const [name, info] of Object.entries(symbols.labels)) {
                                const matches = matchesSearch(name);
                                console.log('[Completion] Label:', name, 'matches searchTerm:', matches);
                                if (matches) {
                                    suggestions.push({
                                        label: '@' + name,
                                        kind: monaco.languages.CompletionItemKind.Reference,
                                        detail: `Label at line ${info.line}`,
                                        documentation: `${info.doc || 'Jump target'}\n${context.paramDesc || ''}`,
                                        insertText: name,
                                        range: range,
                                        sortText: '4_label_' + name
                                    });
                                }
                            }
                        }
                        return { suggestions };
                    }

                    if (prefixFilter.onlyAliases) {
                        // Only show register aliases if registerAlias type is allowed
                        if (isTypeAllowed('registerAlias')) {
                            for (const [name, info] of Object.entries(symbols.aliases)) {
                                if (matchesSearch(name)) {
                                    suggestions.push({
                                        label: '#' + name,
                                        kind: monaco.languages.CompletionItemKind.Variable,
                                        detail: `→ ${info.register}`,
                                        documentation: `${info.doc || 'Register alias'}\nMaps to: ${info.register}\n${context.paramDesc || ''}`,
                                        insertText: name,
                                        range: range,
                                        sortText: '2_alias_' + name
                                    });
                                }
                            }
                        }
                        return { suggestions };
                    }

                    if (prefixFilter.onlyMemory) {
                        // Only show memory aliases if memory type is allowed
                        if (isTypeAllowed('memory')) {
                            for (const [name, info] of Object.entries(symbols.memoryAliases)) {
                                if (matchesSearch(name)) {
                                    // Check if there's already a closing bracket
                                    const charAfterCursor = lineText.charAt(position.column - 1);
                                    const insertClosingBracket = charAfterCursor !== ']';

                                    suggestions.push({
                                        label: '[' + name + ']',
                                        kind: monaco.languages.CompletionItemKind.Field,
                                        detail: `Memory cell = ${info.value}`,
                                        documentation: `${info.doc || 'Memory alias'}\nLocation: ${info.value}\nLine: ${info.line}\n${context.paramDesc || ''}`,
                                        insertText: name + (insertClosingBracket ? ']' : ''),
                                        range: range,
                                        sortText: '5_mem_' + name
                                    });
                                }
                            }
                        }
                        return { suggestions };
                    }

                    if (prefixFilter.onlyRegisters) {
                        // Only show registers if register type is allowed
                        if (isTypeAllowed('register')) {
                            for (let i = 0; i <= 15; i++) {
                                const reg = 'R' + i.toString(16).toUpperCase();
                                const digit = i.toString(16).toUpperCase();
                                if (matchesSearch(digit)) {
                                    suggestions.push({
                                        label: reg,
                                        kind: monaco.languages.CompletionItemKind.Variable,
                                        detail: `Register ${reg}`,
                                        documentation: context.paramDesc || `General-purpose register ${reg}`,
                                        insertText: digit,
                                        range: range,
                                        sortText: '6_reg_' + reg
                                    });
                                }
                            }
                        }
                        return { suggestions };
                    }

                    // Start of line suggestions (no prefix filter)
                    if (isTypeAllowed('opcode')) {
                        for (const [op, info] of Object.entries(opcodesDocs)) {
                            if (matchesSearch(op)) {
                                suggestions.push({
                                    label: op,
                                    kind: monaco.languages.CompletionItemKind.Function,
                                    detail: info.signature,
                                    documentation: info.doc,
                                    insertText: op + ' ',
                                    range: range,
                                    sortText: '0_opcode_' + op,
                                    command: {
                                        id: 'editor.action.triggerSuggest',
                                        title: 'Trigger Suggest'
                                    }
                                });
                            }
                        }
                    }

                    if (isTypeAllowed('const')) {
                        suggestions.push({
                            label: 'CONST',
                            kind: monaco.languages.CompletionItemKind.Snippet,
                            detail: 'Define a compile-time constant',
                            documentation: 'CONST name = value',
                            insertText: 'CONST ${1:name} = ${2:value}',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            range: range,
                            sortText: '0_const'
                        });
                    }

                    // Parameter suggestions based on expected type
                    if (isTypeAllowed('register')) {
                        console.log('[Completion] Adding registers');
                        for (let i = 0; i <= 15; i++) {
                            const reg = 'R' + i.toString(16).toUpperCase();
                            if (matchesSearch(reg)) {
                                suggestions.push({
                                    label: reg,
                                    kind: monaco.languages.CompletionItemKind.Variable,
                                    detail: `Register ${reg}`,
                                    documentation: context.paramDesc || `General-purpose register ${reg}`,
                                    insertText: reg,
                                    range: range,
                                    sortText: '6_reg_' + reg
                                });
                            }
                        }
                    }

                    if (isTypeAllowed('registerAlias')) {
                        for (const [name, info] of Object.entries(symbols.aliases)) {
                            if (matchesSearch(name)) {
                                suggestions.push({
                                    label: '#' + name,
                                    kind: monaco.languages.CompletionItemKind.Variable,
                                    detail: `→ ${info.register}`,

            // Register signature help provider (parameter hints)

                    // Check for label references with @ (support dots)
                    const beforePos = lineContent.substring(0, position.column - 1);

                    const labelMatch = beforePos.match(/@([\w.]*)$/);
                    if (labelMatch) {

                    // Check for register aliases
                    const aliasName = wordText.replace(/^#/, '');
                    if (symbols.aliases[aliasName]) {

                            contents: [

                    if (labelMatch) {

                    if (labelDefMatch && !beforePos.endsWith('@') && !beforePos.endsWith('#') && !beforePos.endsWith('[')) {
                        const afterLabelMatch = afterPos.match(/^([\w.]*)/);

                                }

                    if (aliasMatch) {
                        const afterMatch = afterPos.match(/^(\w*)/);
                        const aliasName = aliasMatch[1] + (afterMatch ? afterMatch[1] : '');

                                    endLineNumber: info.line,

            // Register references provider (Shift+F12 or right-click "Find All References")
            monaco.languages.registerReferenceProvider('revizmasm', {
                provideReferences: (model, position, context) => {
                    const code = model.getValue();
                    const lines = code.split('\n');
                    const symbols = parseSymbols(code);
                    const lineContent = model.getLineContent(position.lineNumber);
                    const references = [];

                    // Determine what type of symbol we're looking for
                    const beforePos = lineContent.substring(0, position.column - 1);
                    const afterPos = lineContent.substring(position.column - 1);

                    let symbolType = null;
                    let symbolName = '';

                    // Check for label (with @) - support dots
                    const labelMatch = beforePos.match(/@([\w.]*)$/);
                    if (labelMatch) {
                        const afterMatch = afterPos.match(/^([\w.]*)/);
                        symbolName = labelMatch[1] + (afterMatch ? afterMatch[1] : '');
                        if (symbols.labels[symbolName]) {
                            symbolType = 'label';
                        }
                    }

                    // Check for register alias (with #)
                    if (!symbolType) {
                        const aliasMatch = beforePos.match(/#(\w*)$/);
                        if (aliasMatch) {
                            const afterMatch = afterPos.match(/^(\w*)/);
                            symbolName = aliasMatch[1] + (afterMatch ? afterMatch[1] : '');
                            if (symbols.aliases[symbolName]) {
                                symbolType = 'alias';
                            }
                        }
                    }

                    // Check for memory alias (inside [])
                    if (!symbolType) {
                        const memMatch = beforePos.match(/\[(\w*)$/);
                        if (memMatch && afterPos.match(/^(\w*)\]/)) {
                            const afterMatch = afterPos.match(/^(\w*)/);
                            symbolName = memMatch[1] + (afterMatch ? afterMatch[1] : '');
                            if (symbols.memoryAliases[symbolName]) {
                                symbolType = 'memory';
                            }
                        }
                    }

                    // Check for constant (plain word)
                    if (!symbolType) {
                        const word = model.getWordAtPosition(position);
                        if (word && symbols.constants[word.word]) {
                            symbolName = word.word;
                            symbolType = 'constant';
                        }
                    }

                    if (!symbolType) return null;

                    // Escape special regex characters in symbol name (for dots in labels)
                    const escapedName = symbolName.replace(/\./g, '\\.');

                    // Find all references in the code
                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i];
                        const lineNum = i + 1;

                        if (symbolType === 'label') {
                            // Find label definition (name:) - must use word boundary before
                            const defMatch = new RegExp(`\\b${escapedName}:`).exec(line);
                            if (defMatch) {
                                references.push({
                                    uri: model.uri,
                                    range: {
                                        startLineNumber: lineNum,
                                        startColumn: defMatch.index + 1,
                                        endLineNumber: lineNum,
                                        endColumn: defMatch.index + symbolName.length + 1
                                    }
                                });
                            }

                            // Find label references (@name) - word boundary or end of string after
                            let refMatch;
                            const refRegex = new RegExp(`@${escapedName}(?=\\b|$)`, 'g');
                            while ((refMatch = refRegex.exec(line)) !== null) {
                                references.push({
                                    uri: model.uri,
                                    range: {
                                        startLineNumber: lineNum,
                                        startColumn: refMatch.index + 2, // Skip @
                                        endLineNumber: lineNum,
                                        endColumn: refMatch.index + symbolName.length + 2
                                    }
                                });
                            }
                        } else if (symbolType === 'alias') {
                            // Find alias definition (#name: Rx)
                            const defMatch = new RegExp(`#${escapedName}:`).exec(line);
                            if (defMatch) {
                                references.push({
                                    uri: model.uri,
                                    range: {
                                        startLineNumber: lineNum,
                                        startColumn: defMatch.index + 2, // Skip #
                                        endLineNumber: lineNum,
                                        endColumn: defMatch.index + symbolName.length + 2
                                    }
                                });
                            }

                            // Find alias references (#name)
                            let refMatch;
                            const refRegex = new RegExp(`#${escapedName}\\b`, 'g');
                            while ((refMatch = refRegex.exec(line)) !== null) {
                                references.push({
                                    uri: model.uri,
                                    range: {
                                        startLineNumber: lineNum,
                                        startColumn: refMatch.index + 2, // Skip #
                                        endLineNumber: lineNum,
                                        endColumn: refMatch.index + symbolName.length + 2
                                    }
                                });
                            }
                        } else if (symbolType === 'memory') {
                            // Find memory alias definition ([name]:)
                            const defMatch = new RegExp(`\\[${escapedName}\\]:`).exec(line);
                            if (defMatch) {
                                references.push({
                                    uri: model.uri,
                                    range: {
                                        startLineNumber: lineNum,
                                        startColumn: defMatch.index + 2, // Skip [
                                        endLineNumber: lineNum,
                                        endColumn: defMatch.index + symbolName.length + 2
                                    }
                                });
                            }

                            // Find memory references ([name])
                            let refMatch;
                            const refRegex = new RegExp(`\\[${escapedName}\\]`, 'g');
                            while ((refMatch = refRegex.exec(line)) !== null) {
                                references.push({
                                    uri: model.uri,
                                    range: {
                                        startLineNumber: lineNum,
                                        startColumn: refMatch.index + 2, // Skip [
                                        endLineNumber: lineNum,
                                        endColumn: refMatch.index + symbolName.length + 2
                                    }
                                });
                            }
                        } else if (symbolType === 'constant') {
                            // Find constant definition (CONST name =)
                            const defMatch = new RegExp(`CONST\\s+${escapedName}\\s*=`).exec(line);
                            if (defMatch) {
                                const nameStart = defMatch[0].indexOf(symbolName);
                                references.push({
                                    uri: model.uri,
                                    range: {
                                        startLineNumber: lineNum,
                                        startColumn: defMatch.index + nameStart + 1,
                                        endLineNumber: lineNum,
                                        endColumn: defMatch.index + nameStart + symbolName.length + 1
                                    }
                                });
                            }

                            // Find constant references (word boundary)
                            let refMatch;
                            const refRegex = new RegExp(`\\b${escapedName}\\b`, 'g');
                            while ((refMatch = refRegex.exec(line)) !== null) {
                                // Skip the definition line
                                if (!line.includes(`CONST ${symbolName}`)) {
                                    references.push({
                                        uri: model.uri,
                                        range: {
                                            startLineNumber: lineNum,
                                            startColumn: refMatch.index + 1,
                                            endLineNumber: lineNum,
                                            endColumn: refMatch.index + symbolName.length + 1
                                        }
                                    });
                                }
                            }
                        }
                    }

                    return references.length > 0 ? references : null;
                }
            });

            function parseNum(str) {
                if (!str) return NaN;
                str = str.toLowerCase();
                if (str.startsWith('0x')) return parseInt(str, 16);
                if (str.startsWith('0b')) return parseInt(str, 2);
                if (str.startsWith('0d')) return parseInt(str, 10);
                if (/^[0-9a-f]{1,2}$/.test(str)) return parseInt(str, 16);
                return NaN;
            }

            function resolve(str, constants, labels, aliases, localAliases, scopeStack, errors) {
                if (str.match(/^R[0-9A-F]$/i)) return parseInt(str.slice(1), 16);
                if (str.startsWith('#')) {
                    const alias = str.slice(1);
                    const currentScope = scopeStack[scopeStack.length - 1];
                    let regStr;
                    if (currentScope && localAliases[currentScope] && localAliases[currentScope][alias]) {
                        regStr = localAliases[currentScope][alias];
                    } else {
                        regStr = aliases[alias];
                    }
                    if (regStr) return parseInt(regStr.slice(1), 16);
                    errors.push(`Undefined alias: ${str}`);
                    return 0;
                }
                if (str.startsWith('@')) {
                    const label = str.slice(1);
                    const addr = labels[label];
                    if (addr !== undefined) return addr;
                    errors.push(`Undefined label: ${str}`);
                    return 0;
                }
                if (str.startsWith('[') && str.endsWith(']')) {
                    const inner = str.slice(1, -1);
                    if (constants[inner] !== undefined) return constants[inner];
                    const num = parseNum(inner);
                    if (!isNaN(num)) return num;
                    errors.push(`Undefined memory alias: ${str}`);
                    return 0;
                }
                if (constants[str] !== undefined) return constants[str];
                const num = parseNum(str);
                if (!isNaN(num)) return num;
                errors.push(`Invalid operand: ${str}`);
                return 0;
            }

    <script>
        // OPCODES map
        const OPCODES = {
            LOAD_1: 0x1,
            LOAD_2: 0x2,
            STORE: 0x3,
            MOVE: 0x4,
            ADD: 0x5,
            ADDI: 0x5,
            ADDF: 0x6,
            OR: 0x7,
            AND: 0x8,
            XOR: 0x9,
            RSHIFT: 0xA,
            JUMP: 0xB,
            HALT: 0xC,
            WAIT: 0xD,
            WRITE: 0xE,
        };

        // Parse numeric with error fallback
        function parseNumeric(value, lineNum, errors) {
            value = value.trim();
            try {
                if (value.startsWith('0x')) {
                    return parseInt(value, 16);
                } else if (value.startsWith('0b')) {
                    return parseInt(value.substring(2), 2);
                } else if (value.startsWith('0o')) {
                    return parseInt(value.substring(2), 8);
                } else if (value.startsWith('0d')) {
                    return parseInt(value.substring(2), 10);
                } else {
                    return parseInt(value, 16);
                }
            } catch (e) {
                errors.push(`Line ${lineNum}: Invalid numeric value: "${value}"`);
                return NaN; // signal invalid
            }
        }

        function isNumeric(value, lineNum, errors) {
            const num = parseNumeric(value, lineNum, errors);
            return !isNaN(num);
        }

        // Parse single line — no throws
        function parseLine(line, lineNum, errors) {
            console.log("Parsing line:", line);
            line = line.trim();
            if (!line || line.startsWith(';')) {
                return null;
            }

            const uncomment = line.split(';')[0].trim();
            if (!uncomment) return null;

            try {
                if (uncomment.startsWith('[') && uncomment.includes(']:')) {
                    const closeIdx = uncomment.indexOf(']');
                    if (closeIdx === -1) throw new Error("Malformed memory init");
                    const label = uncomment.substring(1, closeIdx);
                    const valuePart = uncomment.substring(closeIdx + 2).trim();
                    return { type: 'memory_init', label, value: valuePart, lineNum };
                }

                if (uncomment.startsWith('#') && uncomment.includes(':')) {
                    const colonIdx = uncomment.indexOf(':');
                    const name = uncomment.substring(1, colonIdx);
                    const target = uncomment.substring(colonIdx + 1).trim();
                    return { type: 'alias', name, target, lineNum };
                }

                if (uncomment.startsWith('CONST ')) {
                    const rest = uncomment.substring(6).trim();
                    const eqIdx = rest.indexOf('=');
                    if (eqIdx === -1) {
                        errors.push(`Line ${lineNum}: Invalid CONST syntax (missing '=')`);
                        return null;
                    }
                    const name = rest.substring(0, eqIdx).trim();
                    const value = rest.substring(eqIdx + 1).trim();
                    return { type: 'const', name, value, lineNum };
                }

                if (uncomment.endsWith(':')) {
                    return { type: 'label', name: uncomment.slice(0, -1).trim(), lineNum };
                }

                const _parts = uncomment.split(/[\s]+/);
                if (_parts.length === 0) return null;
                const opcode = _parts[0].toUpperCase();
                if (opcode === 'ADD'){

                const operands = parts.length > 1 ? parts[1].split(',').map(op => op.trim()) : [];
                
                if (opcode === 'ADD'){

                }
                return { type: 'instruction', opcode, operands, lineNum };
            } catch (e) {
                errors.push(`Line ${lineNum}: Parse error: ${e.message}`);
                return null;
            }

                        valid = false;
                        return 0;
                    }
                    const numPart = reg.slice(1);
                    const val = parseNumeric(numPart, ln, errors);
                    if (isNaN(val)) {
                        valid = false;
                        return 0;
                    }
                    return val;
                };

                if (resolvedOpcode === 'STORE' || resolvedOpcode === 'JUMP') {
                    if (resolvedOperands.length !== 2) {
                        errors.push(`Line ${lineNum}: ${resolvedOpcode} requires 2 operands`);
                        continue;
                    }
                    op1 = parseReg(rStr, lineNum);
                    let addr = null;
                    const addrStr = sStr;
                    if (addrStr.startsWith('[') && addrStr.endsWith(']')) {
                        const inner = addrStr.slice(1, -1);
                        if (pointers[inner] !== undefined) {
                            addr = pointers[inner];
                        } else if (isNumeric(inner, lineNum, [])) {
                            addr = parseNumeric(inner, lineNum, errors);
                        } else {
                            errors.push(`Line ${lineNum}: Unknown pointer label: ${inner}`);
                            valid = false;
                        }
                    } else if (addrStr.startsWith('@')) {
                        const label = addrStr.slice(1);
                        if (labels[label] !== undefined) {
                            addr = labels[label];
                        } else {
                            errors.push(`Line ${lineNum}: Unknown label: ${label}`);
                            valid = false;
                        }
                    } else if (constants[addrStr] !== undefined) {
                        addr = constants[addrStr];
                    } else {
                        addr = parseNumeric(addrStr, lineNum, errors);
                        if (isNaN(addr)) valid = false;
                    }
                    if (valid && addr !== null) {
                        op2 = (addr >> 4) & 0xF;
                        op3 = addr & 0xF;
                    }
                }
                else if (resolvedOpcode === 'LOAD_1') {
                    if (resolvedOperands.length !== 2) {
                        errors.push(`Line ${lineNum}: LOAD_1 requires 2 operands`);
                        continue;
                    }
                    op1 = parseReg(rStr, lineNum);
                    const valueStr = sStr;
                    if (!(valueStr.startsWith('[') && valueStr.endsWith(']'))) {
                        errors.push(`Line ${lineNum}: LOAD_1 expects memory reference like [label]`);
                        valid = false;
                    } else {
                        const inner = valueStr.slice(1, -1);
                        let value;
                        if (pointers[inner] !== undefined) {
                            value = pointers[inner];
                        } else if (isNumeric(inner, lineNum, [])) {
                            value = parseNumeric(inner, lineNum, errors);
                        } else {
                            errors.push(`Line ${lineNum}: Unknown pointer label: ${inner}`);
                            valid = false;
                        }
                        if (valid) {
                            op2 = (value >> 4) & 0xF;
                            op3 = value & 0xF;
                        }
                    }
                }
                else if (resolvedOpcode === 'LOAD_2') {
                    if (resolvedOperands.length !== 2) {
                        errors.push(`Line ${lineNum}: LOAD_2 requires 2 operands`);
                        continue;
                    }
                    op1 = parseReg(rStr, lineNum);
                    let value;
                    const valueStr = sStr;
                    if (constants[valueStr] !== undefined) {
                        value = constants[valueStr];
                    } else {
                        value = parseNumeric(valueStr, lineNum, errors);
                        if (isNaN(value)) valid = false;
                    }
                    if (valid) {
                        op2 = (value >> 4) & 0xF;
                        op3 = value & 0xF;
                    }
                }
                else if (['ADD', 'ADDI', 'ADDF', 'OR', 'AND', 'XOR'].includes(resolvedOpcode)) {
                    if (resolvedOperands.length !== 3) {
                        console.log(resolvedOperands);
                        errors.push(`Line ${lineNum}: ${resolvedOpcode} requires 3 operands`);
                        continue;
                    }
                    op1 = parseReg(rStr, lineNum);
                    op2 = parseReg(sStr, lineNum);
                    op3 = parseReg(tStr, lineNum);
                }
                else if (resolvedOpcode === 'MOVE') {
                    if (resolvedOperands.length !== 2) {
                        errors.push(`Line ${lineNum}: MOVE requires 2 operands`);
                        continue;
                    }
                    op2 = parseReg(rStr, lineNum);
                    op3 = parseReg(sStr, lineNum);
                }
                else if (resolvedOpcode === 'WAIT') {
                    if (resolvedOperands.length !== 1) {
                        errors.push(`Line ${lineNum}: WAIT requires 1 operand`);
                        continue;
                    }
                    let value = constants[rStr] !== undefined ? constants[rStr] : parseNumeric(rStr, lineNum, errors);
                    if (isNaN(value)) {
                        valid = false;
                    }
                    if (valid) {
                        op1 = (value >> 8) & 0xF;
                        op2 = (value >> 4) & 0xF;
                        op3 = value & 0xF;
                    }
                }
                else if (resolvedOpcode === 'HALT') {
                    // all zero — no action needed
                }
                else if (resolvedOpcode === 'RSHIFT') {
                    if (resolvedOperands.length !== 2) {
                        errors.push(`Line ${lineNum}: RSHIFT requires 2 operands`);
                        continue;
                    }
                    op1 = parseReg(rStr, lineNum);
                    const xVal = parseNumeric(sStr, lineNum, errors);
                    if (isNaN(xVal)) {
                        valid = false;
                    } else {
                        op3 = xVal;
                    }
                }
                else if (resolvedOpcode === 'WRITE') {
                    if (resolvedOperands.length !== 3) {
                        errors.push(`Line ${lineNum}: WRITE requires 3 operands`);
                        continue;
                    }
                    op1 = parseReg(rStr, lineNum);
                    op2 = parseReg(sStr, lineNum);
                    op3 = parseReg(tStr, lineNum);
                }
                else {
                    errors.push(`Line ${lineNum}: Unhandled opcode: ${resolvedOpcode}`);
                    continue;
                }

                if (valid) {
                    // Clamp operands to 4-bit (0–15)
                    op1 &= 0xF;
                    op2 &= 0xF;
                    op3 &= 0xF;
                    machineCode.push(new MachineInstruction(opcode, [op1, op2, op3]));
                }
            }

            return machineCode;
        }

        // Main compile function — returns { success, output?, errors[] }
        function compile(code, out = "stdout") {
            const errors = [];
            const parsed = parseCode(code, errors);
            const machineCode = assemble(parsed, errors);

            if (errors.length > 0) {
                return { success: false, errors };
            }

            let result = "";
            for (const instr of machineCode) {
                result += instr.compile();
            }

            if (out === "stdout") {
                console.log(result);
            }

            return { success: true, output: result };
        }
    </script>
